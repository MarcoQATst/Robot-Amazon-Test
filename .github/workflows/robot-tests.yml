name: Robot Framework Automated Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Robot Framework Browser Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js (for Playwright / Browser Library)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure Playwright browsers (install Python playwright & browsers)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install playwright
          playwright install --with-deps

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Robot Framework Browser (rfbrowser init)
        run: |
          rfbrowser init

      - name: Run Robot Framework Tests
        run: |
          robot -d results -v HEADLESS:True -v TIMEOUT:20s tests/

      - name: Upload Test Results / Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-reports
          path: results/
          retention-days: 14
